<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Presentación visual sobre los fundamentos de la astrofotografía, pensada para fotógrafos." />
    <meta name="theme-color" content="#04060d" />
    <title>Astrofotografía para fotógrafos</title>

        var t = localStorage.getItem('theme');

      } catch (e) {}
    </script>
  </head>
